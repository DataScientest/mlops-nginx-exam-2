# nginx/nginx.conf

user  nginx;
worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Upstreams pour load balancing
    upstream api_v1_upstream {
        server api-v1-1:8000;
        server api-v1-2:8000;
        server api-v1-3:8000;
    }

    upstream api_v2_upstream {
        server api-v2:8000;
    }

    # Serveur HTTP → redirection vers HTTPS
    server {
        listen 80;
        server_name localhost;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Serveur HTTPS
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;

        # Proxy vers API v1
        location /api/v1/ {
            proxy_pass http://api_v1_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy vers API v2
        location /api/v2/ {
            proxy_pass http://api_v2_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Page par défaut pour test
        location / {
            return 200 "Nginx Reverse Proxy is running\n";
        }
    }
}
